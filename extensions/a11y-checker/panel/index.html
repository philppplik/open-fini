<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="panel.css"></head>
<body>
  <div class="row">
    <button id="run" type="button" class="primary">Run audit</button>
    <button id="fixall" type="button" title="Apply every available fix">Fix all</button>
    <button id="report" type="button">Export report (.md)</button>
    <label class="grow">Show <select id="filter"><option value="all">All</option><option value="error">Errors</option><option value="warning">Warnings</option><option value="info">Notes</option></select></label>
  </div>
  <div id="summary" class="summary" role="status" aria-live="polite">Run the audit to check the current document.</div>
  <ul id="issues" class="issues" aria-label="Issues"></ul>
  <p class="hint">Automatic checks cover part of WCAG 2.2 and cannot judge meaning. Fixes that need your words (alt text, labels) add a clearly marked placeholder.</p>
  <script src="panel.js"></script>
</body>
</html>
