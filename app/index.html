    <style id="of-splash-css">
      .of-splash{--ofl-w:min(600px,calc(100vw - 32px));--ofl-bd:#1d1e22;--ofl-foot:#1f2024;--ofl-ink:#f3f3f6;--ofl-dim:#9a9ca6;--ofl-track:#2c2d33;--ofl-fill:#f3f3f6;position:fixed;inset:0;z-index:2147482000;display:grid;place-items:center;background:var(--ofl-bd);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ofl-ink);opacity:1;transition:opacity .28s ease;-webkit-user-select:none;user-select:none;cursor:default}
      .of-splash[data-theme=light]{--ofl-bd:#e9eaee;--ofl-foot:#fff;--ofl-ink:#141416;--ofl-dim:#6b6e78;--ofl-track:#e7e8eb;--ofl-fill:#151517}
      @media (prefers-color-scheme:light){.of-splash:not([data-theme]){--ofl-bd:#e9eaee;--ofl-foot:#fff;--ofl-ink:#141416;--ofl-dim:#6b6e78;--ofl-track:#e7e8eb;--ofl-fill:#151517}}
      .of-splash.is-done{opacity:0;pointer-events:none}
      .of-splash__card{width:var(--ofl-w);border-radius:calc(var(--ofl-w)*.024);overflow:hidden;background:var(--ofl-foot);box-shadow:0 18px 48px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.18)}
      .of-splash__art{aspect-ratio:1600/670;background:#c4466f linear-gradient(115deg,#3a2350 0%,#b8306a 30%,#f07d45 52%,#f2b9b0 70%,#b89be0 86%,#7f6fd0 100%)}
      .of-splash__art img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .4s ease}
      .of-splash__art img.is-pending{opacity:0}
      .of-splash__bar{position:relative;height:max(3px,calc(var(--ofl-w)*.008));background:var(--ofl-track);overflow:hidden}
      .of-splash__fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--ofl-fill);background:linear-gradient(90deg,var(--ofl-fill) 70%,color-mix(in srgb,var(--ofl-fill) 55%,var(--ofl-track)));transition:width .3s ease}
      .of-splash__bar.is-busy::after{content:"";position:absolute;inset:0;width:30%;background:linear-gradient(90deg,transparent,rgba(128,128,136,.45),transparent);animation:ofl-shimmer 1.1s linear infinite}
      @keyframes ofl-shimmer{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
      .of-splash__foot{display:flex;align-items:center;gap:calc(var(--ofl-w)*.028);height:calc(var(--ofl-w)*.142);padding:0 calc(var(--ofl-w)*.04) 0 calc(var(--ofl-w)*.035)}
      .of-splash__mark{flex:none;width:calc(var(--ofl-w)*.078);height:calc(var(--ofl-w)*.078)}
      .of-splash__word{font-size:calc(var(--ofl-w)*.0575);font-weight:700;letter-spacing:-.01em;line-height:1}
      .of-splash__meta{margin-left:auto;align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:calc(var(--ofl-w)*.008);padding-bottom:calc(var(--ofl-w)*.03);min-width:0;text-align:right}
      .of-splash__status{font-size:max(11px,calc(var(--ofl-w)*.019));color:var(--ofl-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--ofl-w)*.4)}
      .of-splash__ver{font-size:max(12px,calc(var(--ofl-w)*.027));font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
      .of-splash.is-calm,.of-splash.is-calm *{transition:none!important;animation:none!important}
      @media (prefers-reduced-motion:reduce){.of-splash,.of-splash *{transition:none!important;animation:none!important}}
    </style>
