[package]
name = "openfini"
version = "1.3.0"
description = "OpenFini - a lightweight, open-source creative suite (desktop shell)"
authors = ["OpenFini contributors"]
license = "MIT"
repository = "https://github.com/philppplik/open-fini"
homepage = "https://github.com/philppplik/open-fini#readme"
edition = "2021"
# Tauri 2.12 and its plugins require Rust 1.90 or newer.
rust-version = "1.90"
publish = false

# The `_lib` suffix avoids a Windows-only collision between the library and
# binary output names (both would otherwise be called `openfini`).
[lib]
name = "openfini_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `image-png` lets the clipboard plugin accept PNG bytes (see app/src/platform/tauri.js).
# `macos-private-api` makes the webview transparent on macOS, so the vibrancy materials of src/effects.rs show
# (it only compiles in on macOS; it rules out the Mac App Store, which OpenFini does not target).
tauri = { version = "2.12", features = ["image-png", "macos-private-api"] }
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-opener = "2.7"
# Built-in network clients (src/netio.rs, ftp.rs, smtp.rs): TLS through the operating system's own stack and
# trusted certificates (SChannel, Secure Transport, OpenSSL on Linux), no C code to compile on Windows or macOS.
native-tls = "0.2"
# Already in the dependency tree through tauri; used directly for command arguments and the relay's JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop only: a second launch hands its arguments to the running instance.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.5"
# In-app updates (src/updater.rs, docs/updates.md): signed updates from the GitHub release, then a relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Computer use for the assistant (src/computer.rs, docs/vibe-computer-use.md): Windows and macOS only. Screen capture
# (xcap, Apache-2.0), synthetic mouse and keyboard input (enigo, MIT), JPEG/PNG encoding and downscaling (image,
# MIT OR Apache-2.0) and the emergency stop hotkey (tauri-plugin-global-shortcut, MIT OR Apache-2.0). Linux is left
# out: xcap needs PipeWire, GBM and Wayland development packages the build machines do not have; there the commands
# answer "not supported".
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
xcap = { version = "0.9", default-features = false }
enigo = { version = "0.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-global-shortcut = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_Security"] }

# Tuned for a tiny native binary. Build time is traded for size.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
