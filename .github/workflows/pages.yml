name: Website

# Builds the website (site/, docs/concepts/website.md) and deploys it to GitHub Pages.
# Pull requests build it and run the quality gates (internal links, HTML validation, axe-core on every page,
# Lighthouse budgets on four pages); they never deploy. Deploys happen only from main, and only when
# Pages is enabled for the repository (Settings > Pages > Source: GitHub Actions); until then the deploy
# job is skipped with a notice instead of failing.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wiki/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "package.json"
      - "app/assets/launch/**"
      - "app/src/engine/web/markdown.js"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "wiki/**"
      - "docs/**"
      - "CHANGELOG.md"
      - "scripts/site-check.mjs"
      - "scripts/lib/cdp.mjs"
      - "scripts/serve.mjs"
      - "app/src/engine/web/markdown.js"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.head_ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The build needs nothing from node_modules (no dependencies beyond Node and the app's own modules).
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_BASE: /${{ github.event.repository.name }}/
        run: node site/build.mjs --strict

      - name: Is GitHub Pages enabled?
        id: pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type > pages.txt 2>/dev/null && grep -q workflow pages.txt; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Website not deployed::GitHub Pages is not enabled with the source 'GitHub Actions' (Settings > Pages). The site was built but not deployed."
          fi

      - name: Upload the Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  quality:
    name: Site quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # served at the root, as the checkers expect; --strict also fails on missing template strings
      - name: Build (base path /)
        run: node site/build.mjs --offline --strict

      # The checkers are tools, not project dependencies: install pinned versions into a temporary folder.
      - name: Install the checkers
        run: npm install --prefix "$RUNNER_TEMP/site-tools" --no-audit --no-fund axe-core@4.14.1 html-validate@11.21.1 @lhci/cli@0.16.1

      - name: Validate the HTML
        run: node "$RUNNER_TEMP/site-tools/node_modules/html-validate/bin/html-validate.mjs" --config site/.htmlvalidate.json "site/dist/**/*.html"

      - name: Accessibility (axe-core, every page)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/site-check.mjs --axe "$RUNNER_TEMP/site-tools/node_modules/axe-core/axe.min.js"

      - name: Lighthouse budgets (four pages)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node "$RUNNER_TEMP/site-tools/node_modules/@lhci/cli/src/cli.js" autorun --config=site/lighthouserc.json

  deploy:
    name: Deploy to GitHub Pages
    needs: [build, quality]
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
